import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Signing
//
// Sideload builds share one identity (the release keystore) so every new build
// installs in place over the previous one. Credentials are read, in order, from:
//   1. env vars  ORBIT_ANDROID_KEYSTORE_PATH / _KEYSTORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD
//   2. the first keystore.properties found in android/, packages/mobile/, or the repo root
// The keystore files and keystore.properties are gitignored.
// ---------------------------------------------------------------------------
def keystorePropsFile = [
    rootProject.file('keystore.properties'),
    rootProject.file('../keystore.properties'),
    rootProject.file('../../keystore.properties'),
    rootProject.file('../../../keystore.properties'),
].find { it.exists() }

def keystoreProps = new Properties()
if (keystorePropsFile) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def resolveStoreFile = { value ->
    if (!value) return null
    def f = new File(value.toString())
    if (f.isAbsolute()) return f
    return keystorePropsFile ? new File(keystorePropsFile.parentFile, value.toString()) : f
}

def releaseStoreFilePath = System.getenv('ORBIT_ANDROID_KEYSTORE_PATH') ?: keystoreProps.getProperty('storeFile')
def releaseStorePassword = System.getenv('ORBIT_ANDROID_KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
def releaseKeyAlias = System.getenv('ORBIT_ANDROID_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('ORBIT_ANDROID_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def releaseStoreFile = resolveStoreFile(releaseStoreFilePath)

def localDebugKeystore = rootProject.file('debug.keystore')

// ---------------------------------------------------------------------------
// Versioning
//
// versionName comes from the workspace package.json (single source of truth).
// versionCode defaults to the git commit count (monotonic on a linear branch).
// Both can be overridden by ORBIT_ANDROID_VERSION_NAME / _VERSION_CODE (CI).
// ---------------------------------------------------------------------------
def packageVersionName = '0.0.0'
try {
    def pkg = new JsonSlurper().parse(rootProject.file('../../../package.json'))
    if (pkg?.version) packageVersionName = pkg.version.toString()
} catch (Exception ignored) {
    logger.lifecycle('Could not read workspace package.json version; using 0.0.0')
}

def gitCommitCount = {
    try {
        def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootProject.projectDir)
        proc.waitFor()
        def count = proc.text.trim() as Integer
        return count > 0 ? count : 1
    } catch (Exception ignored) {
        return 1
    }
}

def gitShallow = {
    try {
        def proc = ['git', 'rev-parse', '--is-shallow-repository'].execute(null, rootProject.projectDir)
        proc.waitFor()
        return proc.text.trim() == 'true'
    } catch (Exception ignored) {
        return false
    }
}

def resolvedVersionCode = (() -> {
    def override = System.getenv('ORBIT_ANDROID_VERSION_CODE')
    if (override) return override.toInteger()
    def count = gitCommitCount()
    // A shallow clone (CI default fetch-depth: 1) reports 1 for every build,
    // which would collide across releases. Fall back to a time-based, strictly
    // increasing value; set ORBIT_ANDROID_VERSION_CODE for reproducible releases.
    if (count <= 1 || gitShallow()) {
        logger.lifecycle('versionCode: git history unavailable/shallow; using time-based value (override with ORBIT_ANDROID_VERSION_CODE)')
        return (int) (System.currentTimeMillis() / 1000)
    }
    return count
})()
def resolvedVersionName = System.getenv('ORBIT_ANDROID_VERSION_NAME') ?: packageVersionName

android {
    namespace "com.orbit.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.orbit.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        debug {
            if (localDebugKeystore.exists()) {
                storeFile localDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            // Sideload builds use the release identity when available so updates
            // install in place instead of failing on a signature mismatch.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (localDebugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Surface the resolved identity on every build so it is obvious which artifact
// was produced with which signing key.
tasks.matching { it.name in ['assembleDebug', 'assembleRelease', 'bundleRelease'] }.configureEach {
    doFirst {
        logger.lifecycle("[orbit-mobile] versionName=${resolvedVersionName} versionCode=${resolvedVersionCode} " +
            "signing=${hasReleaseSigning ? 'release-keystore' : (localDebugKeystore.exists() ? 'debug-keystore' : 'NONE')}")
    }
}

// A release build with no signing config silently produces an *unsigned* APK,
// which is easy to mistake for a shippable artifact. Fail loudly instead.
tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach {
    doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException(
                'Release build requested but no signing credentials were found. ' +
                'Set ORBIT_ANDROID_KEYSTORE_PATH/_KEYSTORE_PASSWORD/_KEY_ALIAS/_KEY_PASSWORD ' +
                'or provide keystore.properties (see README).'
            )
        }
    }
}
